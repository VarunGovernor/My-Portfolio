name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify V2 live homepage before deployment
        run: |
          test -f dist/index.html
          test -f dist/legacy/index.html
          test -f dist/v2/assets/kinetic.css
          test -f dist/v2/assets/kinetic.js
          grep -q 'v2/assets/kinetic.css' dist/index.html
          grep -q 'v2/assets/kinetic.js' dist/index.html
          grep -q 'legacy/index.html#cs1' dist/index.html
          grep -q 'id="case-studies"' dist/legacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
