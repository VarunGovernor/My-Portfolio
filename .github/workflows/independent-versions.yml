name: Independent portfolio versions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify independent version outputs and design anchors
        run: |
          test -f dist/index.html
          test -f dist/v2/index.html
          test -f dist/v3/index.html
          test -f dist/v4/index.html
          grep -q 'background-size:13px 100%' dist/v2/index.html
          grep -q 'feDisplacementMap' dist/v2/index.html
          grep -q 'starfield' dist/v3/index.html
          grep -q 'equalizer-scene' dist/v3/index.html
          grep -q '#FC734D' dist/v3/index.html
          grep -q '#105BFF' dist/v4/index.html
          grep -q '#ff48a5' dist/v4/index.html
          for v in v2 v3 v4; do
            if grep -q 'images/profile.jpeg' "dist/$v/index.html"; then
              echo "Profile image unexpectedly referenced in $v"
              exit 1
            fi
          done
          cmp index.html dist/index.html >/dev/null || echo "Vite may have transformed original index.html; source is unchanged."

      - name: Capture desktop and mobile design previews
        continue-on-error: true
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome unavailable on runner"; exit 1; fi
          mkdir -p previews
          npm run preview -- --host 127.0.0.1 --port 4173 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/My-Portfolio/v2/ > /dev/null; then break; fi
            sleep 1
          done
          for v in v2 v3 v4; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --window-size=1440,1000 --force-device-scale-factor=1 --virtual-time-budget=2500 \
              --screenshot="previews/${v}-desktop.png" "http://127.0.0.1:4173/My-Portfolio/${v}/"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --window-size=390,850 --force-device-scale-factor=1 --virtual-time-budget=2500 \
              --screenshot="previews/${v}-mobile.png" "http://127.0.0.1:4173/My-Portfolio/${v}/"
          done
          # Compare a later frame against the usual hero screenshot to verify ongoing motion.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,1000 --force-device-scale-factor=1 --virtual-time-budget=7100 \
            --screenshot="previews/v2-motion-later.png" "http://127.0.0.1:4173/My-Portfolio/v2/"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:4173/My-Portfolio/v2/" > previews/v2-runtime-dom.html
          grep -q 'class="sig-letter"' previews/v2-runtime-dom.html
          grep -q 'v2-flow-canvas' previews/v2-runtime-dom.html
          grep -q -- '--rib' previews/v2-runtime-dom.html
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          a=Image.open('previews/v2-desktop.png').convert('RGB')
          b=Image.open('previews/v2-motion-later.png').convert('RGB')
          box=ImageChops.difference(a,b).getbbox()
          if box is None:
              raise SystemExit('V2 motion frames were identical; expected visible animation.')
          print('V2 animation produced changed pixels:', box)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-portfolio-preview-bundle
          path: |
            dist/v2/index.html
            dist/v2/assets/**
            dist/v3/index.html
            dist/v4/index.html
            previews/*.png
          if-no-files-found: warn
